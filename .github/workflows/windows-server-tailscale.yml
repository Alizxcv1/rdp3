name: Windows Server (Tailscale)

on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd!" -Force)
        Write-Host "RDP enabled"
      shell: powershell

    - name: Install and Connect Tailscale
      run: |
        Write-Host "Installing Tailscale..."
        curl -L -o C:\Temp\tailscale-setup.exe https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe
        Start-Process -FilePath "C:\Temp\tailscale-setup.exe" -ArgumentList "/install" -NoNewWindow -Wait
        Start-Sleep -Seconds 5
        Write-Host "Connecting to Tailscale..."
        C:\"Program Files"\Tailscale\tailscale.exe up --authkey=tskey-auth-k9jpfLK5dE11CNTRL-YS8n4sv84iHay3Fi7jY5jHL3dHSiQoDK --hostname=github-runner-windows
        Start-Sleep -Seconds 10
        $ip = C:\"Program Files"\Tailscale\tailscale.exe ip -4
        Write-Host "Tailscale IP: $ip"
        Add-Content -Path $env:GITHUB_ENV -Value "TAILSCALE_IP=$ip"
      shell: powershell

    - name: Server Info
      run: |
        Write-Host "========== SERVER ONLINE =========="
        Write-Host "Hostname: github-runner-windows"
        Write-Host "RDP IP: ${{ env.TAILSCALE_IP }}"
        Write-Host "RDP Port: 3389"
        Write-Host "RDP User: runneradmin"
        Write-Host "RDP Password: P@ssw0rd!"
        Write-Host "=================================="
      shell: powershell

    - name: Keep Alive
      run: |
        Write-Host "Server running (6 hours timeout)..."
        for ($i = 1; $i -le 360; $i++) {
          Start-Sleep -Seconds 60
          Write-Host "Minute $i : Still online"
        }
      shell: powershell
